<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrNet - Fast Proxy</title>
<style>
body{background:#0a0a0a;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;margin:0}
h1{font-size:3em;letter-spacing:4px;margin-bottom:20px}
.search-box{display:flex;width:90%;max-width:600px;background:#1a1a1a;border-radius:30px;padding:10px 20px;border:1px solid #333}
.search-box input{flex:1;background:transparent;border:none;color:white;outline:none;font-size:18px}
.search-box button{background:white;border:none;border-radius:20px;padding:8px 20px;cursor:pointer;font-weight:bold}
#proxy-status{text-align:center;margin-top:12px;font-size:15px;height:20px;transition:0.2s}
iframe{width:100%;height:80vh;border:none;margin-top:20px;display:none;border-radius:12px}
</style>
</head>
<body>
<h1>OrNet</h1>
<div class="search-box">
<input id="searchInput" type="text" placeholder="Cerca con OrNet...">
<button onclick="attivaProxy()">Vai</button>
</div>
<div id="proxy-status"></div>
<iframe id="proxyFrame"></iframe>

<script>
function attivaProxy(){
  const statusEl = document.getElementById('proxy-status');
  const frame = document.getElementById('proxyFrame');
  let q = document.getElementById('searchInput').value.trim();
  if(!q) return;

  // VELOCISSIMO: mostra subito attivato
  statusEl.innerText = "proxy attivato";
  statusEl.style.color = "#00ff88";

  let url;
  // Se è un link -> aprilo
  if(q.includes('.') && !q.includes(' ')){
    if(!q.startsWith('http')) url = 'https://' + q;
    else url = q;
  } else {
    // Se è una ricerca -> cerca su DuckDuckGo (più veloce e non blocca iframe)
    url = 'https://duckduckgo.com/?q=' + encodeURIComponent(q);
  }

  frame.src = url;
  frame.style.display = "block";
  window.scrollTo(0, document.body.scrollHeight);
}

document.getElementById('searchInput').addEventListener('keydown', function(e){
  if(e.key === 'Enter') attivaProxy();
});
</script>
</body>
</html>
