<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EDG Protocol - OrNet | Motore di Ricerca Anonimo</title>
<meta name="description" content="EDG Protocol - OrNet è il motore di ricerca anonimo e sicuro. EDG Protocol con 4 nodi proxy attivi.">
<meta name="keywords" content="edg protocol, edg, ornet, motore ricerca anonimo, proxy">
<meta name="robots" content="index, follow">
<style>
body{background:#0a0a0a;color:white;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh;margin:0;padding-top:60px}
h1{font-size:3.2em;letter-spacing:5px;margin-bottom:5px}
h2{color:#00ff88;font-size:14px;letter-spacing:3px;margin-bottom:20px;font-weight:normal}
.search-box{display:flex;width:92%;max-width:620px;background:#1a1a1a;border-radius:30px;padding:12px 20px;border:1px solid #333}
.search-box input{flex:1;background:transparent;border:none;color:white;outline:none;font-size:18px}
.search-box button{background:white;border:none;border-radius:20px;padding:8px 20px;cursor:pointer;font-weight:bold;color:#0066ff}
#proxy-status{text-align:center;margin-top:12px;font-size:15px;color:#00ff88}
.nodes{display:flex;gap:10px;margin-top:25px;flex-wrap:wrap;justify-content:center;width:95%;max-width:700px}
.node{background:#141414;border:1px solid #2a2a2a;border-radius:12px;padding:10px 14px;font-size:13px;cursor:pointer;display:flex;align-items:center;gap:8px}
.node.active{border-color:#00ff88;background:#0f2018}
.dot{width:8px;height:8px;background:#00ff88;border-radius:50%}
.ping{color:#888;font-size:11px}
</style>
</head>
<body>
<h1>OrNet</h1>
<h2>EDG PROTOCOL</h2>
<div class="search-box">
<input id="searchInput" type="text" placeholder="Cerca con EDG Protocol...">
<button onclick="attivaProxy()">Vai</button>
</div>
<div id="proxy-status">EDG Protocol proxy pronto su GOOGLE</div>
<div class="nodes">
  <div class="node active"><span class="dot"></span> NODE-1 <span class="ping">EU-West • 12ms</span></div>
  <div class="node"><span class="dot"></span> NODE-2 <span class="ping">US-East • 28ms</span></div>
  <div class="node"><span class="dot"></span> NODE-3 <span class="ping">Asia • 45ms</span></div>
  <div class="node"><span class="dot"></span> NODE-4 <span class="ping">Stealth • 19ms</span></div>
</div>
<script>
function attivaProxy(){
  let q=document.getElementById('searchInput').value.trim();
  if(!q) return;
  window.location.href='https://www.google.com/search?q='+encodeURIComponent(q);
}
document.getElementById('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')attivaProxy()});
</script>
</body>
</html>
