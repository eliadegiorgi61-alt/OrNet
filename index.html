<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OrNet - EDG Protocol</title>
<style>
body{ background:#000; color:#00ff88; font-family:monospace; text-align:center; padding:20px; }
h1{ font-size:40px; text-shadow:0 0 15px #00ff88; }
.box{ border:2px solid #00ff88; border-radius:15px; padding:20px; max-width:500px; margin:20px auto; box-shadow:0 0 20px #00ff88; }
input{ width:90%; padding:12px; border-radius:10px; border:none; margin:10px 0; }
button{ background:#00ff88; color:#000; padding:12px 25px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
.status{ margin-top:15px; color:#fff; }
</style>
</head>
<body>
<h1>OrNet</h1>
<div class="box">
<h2>EDG PROTOCOL - PARANOID MODE ATTIVO</h2>
<p>Motore di ricerca privato super protetto</p>
<input type="text" id="q" placeholder="Cerca anonimo...">
<button onclick="search()">CERCA</button>
<div class="status" id="status">4 NODE Attivi | WebRTC Blocked | No-Track ON</div>
</div>

<script>
// PARANOID MODE AUTO - EDG Protocol
try {
  if(navigator.mediaDevices){
    navigator.mediaDevices.getUserMedia = () => Promise.reject(new Error("Blocked by EDG Paranoid"));
  }
  window.RTCPeerConnection = null;
  window.webkitRTCPeerConnection = null;
  console.log("EDG Paranoid Mode ATTIVO");
} catch(e){}

function search(){
  let query = document.getElementById('q').value;
  if(!query) return;
  document.getElementById('status').innerText = "Ricerca anonima su 4 NODE...";
  // proxy google
  window.open('https://www.google.com/search?q=' + encodeURIComponent(query), '_blank');
}
</script>
</body>
</html>
